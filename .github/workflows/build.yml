name: build-phase74-canary
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee app/build/outputs/apk/debug/apk-files.txt
          grep -F 'lib/arm64-v8a/libdexkit.so' app/build/outputs/apk/debug/apk-files.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/debug/apksigner.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MotoG85-Phase74-Canary
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/apksigner.txt
            app/build/outputs/apk/debug/apk-files.txt
