plugins { id 'com.android.application' }

android {
    namespace 'com.leo.motog85.scrolltranslate.canary'
    compileSdk 35
    defaultConfig {
        applicationId 'com.leo.motog85.scrolltranslate.canary'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.2-p7.4-enum-dexkitfix'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'org.luckypray:dexkit:2.2.0'
}
